<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:creator>RealFaviconGenerator</dc:creator><dc:source>https://realfavicongenerator.net</dc:source></rdf:Description></rdf:RDF></metadata><defs>
    <!-- Hiệu ứng phát sáng Neon -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0080"></stop>
      <stop offset="50%" stop-color="#00ff80"></stop>
      <stop offset="100%" stop-color="#00c3ff"></stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"></feGaussianBlur>
      <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
    </filter>
  </defs><rect width="512" height="512" rx="110" fill="#0a0a0a"></rect><rect x="16" y="16" width="480" height="480" rx="95" fill="none" stroke="url(#neonGrad)" stroke-width="12" opacity="0.8"></rect><g filter="url(#glow)">
    <!-- Nét cách điệu chữ Y và T mang hình dáng tốc độ -->
