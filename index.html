<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Marketing - Tạp Hóa Ya Thông</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: radial-gradient(circle at top, #1a1a2e 0%, #0a0a0c 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 13px;
            color: #a0a0c0;
        }
        .realtime-clock {
            text-align: center;
            font-size: 12px;
            color: #00ffcc;
            margin-bottom: 15px;
            background: rgba(0, 255, 204, 0.05);
            padding: 6px;
            border-radius: 6px;
            border: 1px dashed rgba(0, 255, 204, 0.2);
        }
        .timer-box {
            background: rgba(255, 153, 0, 0.1);
            border: 1px solid rgba(255, 153, 0, 0.3);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            margin-bottom: 20px;
        }
        .timer-box h3 {
            font-size: 12px;
            color: #ff9900;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        #countdown {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: #fff;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #ccc;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            border-color: #00ffcc;
        }
        .carrier-container {
            display: flex;
            gap: 8px;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .carrier-card {
            cursor: pointer;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 8px;
            background: #111;
            text-align: center;
            flex: 1;
            transition: all 0.3s;
        }
        .carrier-card.selected {
            border-color: #00ffcc;
            background: rgba(0, 255, 204, 0.1);
        }
        .carrier-badge {
            font-size: 11px;
            font-weight: bold;
            padding: 6px 4px;
            border-radius: 4px;
            color: #fff;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00ffcc 0%, #00b386 100%);
            color: #0a0a0c;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: opacity 0.3s;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }
        .momo-section {
            margin-top: 20px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
        }
        .momo-section p {
            font-size: 12px;
            color: #a0a0c0;
            margin-bottom: 10px;
        }
        .momo-qr {
            width: 100px;
            height: 100px;
            background: #fff;
            padding: 6px;
            border-radius: 8px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Tạp Hóa Ya Thông</h1>
            <p>Hệ Thống WiFi Gaming & Tiện Ích</p>
        </div>

        <div class="realtime-clock" id="realtimeClock">Đang tải thời gian...</div>

        <div class="timer-box">
            <h3>Thời gian sử dụng miễn phí còn lại</h3>
            <div id="countdown">24:00:00</div>
        </div>

        <form id="wifiForm">
            <div class="form-group">
                <label>Họ và tên của bạn</label>
                <input type="text" id="name" class="form-control" placeholder="Nhập tên của bạn..." required>
            </div>

            <div class="form-group">
                <label>Số điện thoại / Zalo</label>
                <input type="tel" id="phone" class="form-control" placeholder="Nhập số điện thoại..." required>
            </div>

            <div class="form-group">
                <label>Chọn nhà mạng giao dịch / mua thẻ</label>
                <div class="carrier-container">
                    <div class="carrier-card" onclick="selectCarrier(this, 'VIETTEL')">
                        <div class="carrier-badge" style="background: #E00707;">VIETTEL</div>
                    </div>
                    <div class="carrier-card" onclick="selectCarrier(this, 'VINAPHONE')">
                        <div class="carrier-badge" style="background: #00B14F;">VINAPHONE</div>
                    </div>
                    <div class="carrier-card" onclick="selectCarrier(this, 'MOBIFONE')">
                        <div class="carrier-badge" style="background: #004D9F;">MOBIFONE</div>
                    </div>
                </div>
                <input type="hidden" id="selectedCarrier" value="">
            </div>

            <button type="submit" class="btn-submit">Kết Nối Internet Ngay</button>
        </form>

        <div class="momo-section">
            <p>Quét mã ủng hộ / thanh toán nhanh qua MoMo</p>
            <!-- Thay src bằng link ảnh QR MoMo thực tế của bạn -->
            <img src="https://via.placeholder.com/100" alt="QR MoMo" class="momo-qr">
        </div>
    </div>

    <script>
        // 1. Đồng hồ thời gian thực
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('vi-VN');
            const dateString = now.toLocaleDateString('vi-VN');
            document.getElementById('realtimeClock').innerText = `📅 ${dateString} | ⏰ ${timeString}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Chọn nhà mạng
        function selectCarrier(element, carrierName) {
            document.querySelectorAll('.carrier-card').forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById('selectedCarrier').value = carrierName;
        }

        // 3. Đếm ngược 24h sử dụng localStorage
        const TIMER_KEY = 'yathong_wifi_expiry';
        let totalSeconds = 24 * 3600;

        if (localStorage.getItem(TIMER_KEY)) {
            const expiryTime = parseInt(localStorage.getItem(TIMER_KEY));
            const remaining = Math.floor((expiryTime - Date.now()) / 1000);
            if (remaining > 0) {
                totalSeconds = remaining;
            } else {
                localStorage.setItem(TIMER_KEY, Date.now() + totalSeconds * 1000);
            }
        } else {
            localStorage.setItem(TIMER_KEY, Date.now() + totalSeconds * 1000);
        }

        const countdownInterval = setInterval(() => {
            let hours = Math.floor(totalSeconds / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = totalSeconds % 60;

            document.getElementById('countdown').innerText = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            if (totalSeconds > 0) {
                totalSeconds--;
            } else {
                clearInterval(countdownInterval);
                document.getElementById('countdown').innerText = "Đã hết hạn 24h!";
            }
        }, 1000);

        // 4. Xử lý gửi form về Google Apps Script
        document.getElementById('wifiForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const carrier = document.getElementById('selectedCarrier').value;

            const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE'; // Thay link Web App GAS của bạn vào đây

            if(scriptURL !== 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, carrier, time: new Date().toLocaleString() })
                }).then(() => {
                    alert('Kết nối thành công! Chúc bạn trải nghiệm mạng vui vẻ tại Tạp Hóa Ya Thông.');
                    window.location.href = "https://google.com"; // Hoặc trang đích mong muốn sau khi đăng nhập
                }).catch(error => console.error('Error!', error.message));
            } else {
                alert('Kết nối thành công! (Chưa cấu hình Google Apps Script URL)');
                window.location.href = "https://google.com";
            }
        });
    </script>
</body>
</html>
