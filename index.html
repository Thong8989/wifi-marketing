<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Marketing - Tạp Hóa Ya Thông</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: radial-gradient(circle at top, #0a0a0a 0%, #000 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(15, 15, 20, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 12px;
            color: #888;
        }
        .realtime-clock {
            text-align: center;
            font-size: 11px;
            color: #00ffcc;
            margin-bottom: 12px;
            background: rgba(0, 255, 204, 0.05);
            padding: 5px;
            border-radius: 4px;
            border: 1px dashed rgba(0, 255, 204, 0.2);
        }
        .timer-box {
            background: rgba(255, 153, 0, 0.1);
            border: 1px solid rgba(255, 153, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            margin-bottom: 15px;
        }
        .timer-box h3 {
            font-size: 11px;
            color: #ff9900;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        #countdown {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            color: #fff;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            color: #bbb;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            background: #111;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .form-control:focus {
            border-color: #00ffcc;
        }
        .carrier-container {
            display: flex;
            gap: 6px;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .carrier-card {
            cursor: pointer;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 6px;
            background: #111;
            text-align: center;
            flex: 1;
            transition: all 0.2s;
        }
        .carrier-card.selected {
            border-color: #00ffcc;
            background: rgba(0, 255, 204, 0.15);
        }
        .carrier-badge {
            font-size: 10px;
            font-weight: bold;
            padding: 5px 2px;
            border-radius: 4px;
            color: #fff;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }
        .momo-section {
            margin-top: 15px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 12px;
        }
        .momo-section p {
            font-size: 11px;
            color: #888;
            margin-bottom: 8px;
        }
        .momo-qr {
            width: 90px;
            height: 90px;
            background: #fff;
            padding: 4px;
            border-radius: 6px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Tạp Hóa Ya Thông</h1>
            <p>Hệ Thống WiFi Gaming & Tiện Ích</p>
        </div>

        <div class="realtime-clock" id="realtimeClock">Đang tải thời gian...</div>

        <div class="timer-box">
            <h3>Thời gian sử dụng còn lại</h3>
            <div id="countdown">24:00:00</div>
        </div>

        <form id="wifiForm">
            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" id="name" class="form-control" placeholder="Nhập tên..." required>
            </div>

            <div class="form-group">
                <label>Số điện thoại / Zalo</label>
                <input type="tel" id="phone" class="form-control" placeholder="Nhập số điện thoại..." required>
            </div>

            <div class="form-group">
                <label>Chọn nhà mạng giao dịch</label>
                <div class="carrier-container">
                    <div class="carrier-card" onclick="selectCarrier(this, 'VIETTEL')">
                        <div class="carrier-badge" style="background: #E00707;">VIETTEL</div>
                    </div>
                    <div class="carrier-card" onclick="selectCarrier(this, 'VINAPHONE')">
                        <div class="carrier-badge" style="background: #00B14F;">VINAPHONE</div>
                    </div>
                    <div class="carrier-card" onclick="selectCarrier(this, 'MOBIFONE')">
                        <div class="carrier-badge" style="background: #004D9F;">MOBIFONE</div>
                    </div>
                </div>
                <input type="hidden" id="selectedCarrier" value="">
            </div>

            <button type="submit" class="btn-submit">Kết Nối WiFi</button>
        </form>

        <div class="momo-section">
            <p>Quét mã ủng hộ / thanh toán MoMo</p>
            <img src="https://via.placeholder.com/90" alt="QR MoMo" class="momo-qr">
        </div>
    </div>

    <script>
        // 1. Đồng hồ thời gian thực
        function updateClock() {
            const now = new Date();
            document.getElementById('realtimeClock').innerText = `📅 ${now.toLocaleDateString('vi-VN')} | ⏰ ${now.toLocaleTimeString('vi-VN')}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Chọn nhà mạng
        function selectCarrier(element, carrierName) {
            document.querySelectorAll('.carrier-card').forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById('selectedCarrier').value = carrierName;
        }

        // 3. Đếm ngược 24h dùng localStorage
        const TIMER_KEY = 'yathong_wifi_expiry';
        let totalSeconds = 24 * 3600;

        if (localStorage.getItem(TIMER_KEY)) {
            const expiryTime = parseInt(localStorage.getItem(TIMER_KEY));
            const remaining = Math.floor((expiryTime - Date.now()) / 1000);
            if (remaining > 0) {
                totalSeconds = remaining;
            } else {
                localStorage.setItem(TIMER_KEY, Date.now() + totalSeconds * 1000);
            }
        } else {
            localStorage.setItem(TIMER_KEY, Date.now() + totalSeconds * 1000);
        }

        setInterval(() => {
            if (totalSeconds > 0) {
                totalSeconds--;
                let h = Math.floor(totalSeconds / 3600);
                let m = Math.floor((totalSeconds % 3600) / 60);
                let s = totalSeconds % 60;
                document.getElementById('countdown').innerText = 
                    `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
        }, 1000);

        // 4. Gửi dữ liệu về Google Apps Script
        document.getElementById('wifiForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const carrier = document.getElementById('selectedCarrier').value;

            const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE'; // Thay link Web App GAS của bạn vào đây

            if(scriptURL !== 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, carrier, time: new Date().toLocaleString() })
                }).then(() => {
                    alert('Kết nối thành công!');
                    window.location.href = "https://google.com";
                }).catch(error => console.error('Error!', error.message));
            } else {
                alert('Kết nối thành công!');
                window.location.href = "https://google.com";
            }
        });
    </script>
</body>
</html>
